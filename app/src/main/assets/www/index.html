<!doctype html>
<html lang="ne">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>कलैया अनलाइन</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header class="top">
      <img src="wordmark.png" alt="KONLINE.com" />
      <div class="stripes"><span></span><span></span></div>
    </header>
    <main id="app"><p class="empty">समाचार लोड हुँदैछ…</p></main>
    <nav class="tabbar">
      <button type="button" data-tab="home">गृह</button>
      <button type="button" data-tab="gallery">फोटो</button>
      <button type="button" data-tab="directory">डाइरेक्टरी</button>
    </nav>
    <script>
      window.onerror = function (message) {
        var el = document.getElementById("app");
        if (el) el.textContent = "एप खुल्न सकेन: " + message;
      };
    </script>
    <script src="app.js"></script>
  </body>
</html>
